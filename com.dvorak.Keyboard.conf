<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.dvorak.Keyboard"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.dvorak.Keyboard"/>
    <allow receive_sender="com.dvorak.Keyboard"/>

    <allow send_interface="com.dvorak.Keyboard"/>
  </policy>
</busconfig>
